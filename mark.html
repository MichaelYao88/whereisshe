<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhereIsShe · Mark the unplaced shots</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=fd29b2f433">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css?v=fd29b2f433">
<style>
:root{--bg:#0f1117;--card:#181b24;--ink:#f2f3f7;--muted:#9aa0ae;--brand:#3d5afe;--good:#22c55e;--warn:#f59e0b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:#8ea2ff}
.app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);grid-template-rows:auto minmax(0,1fr);height:100svh}
header{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid #262a36}
header h1{font-size:16px;margin:0 8px 0 0;letter-spacing:-.01em}
.prog{font-weight:700;color:var(--muted)}
.bar{flex:1;min-width:80px;height:6px;border-radius:9px;background:#262a36;overflow:hidden}.bar i{display:block;height:100%;background:var(--good);width:0}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 14px;background:#262a36;color:var(--ink);cursor:pointer;white-space:nowrap}
button.primary{background:var(--brand);color:#fff}button:disabled{opacity:.45;cursor:default}
.left{display:flex;flex-direction:column;min-height:0;padding:12px;gap:10px;overflow:auto}
.frame{position:relative;flex:1;min-height:260px;border-radius:14px;overflow:hidden;background:#000;display:grid;place-items:center}
.frame::before{content:"";position:absolute;inset:-30px;background:var(--bgimg) center/cover;filter:blur(26px) brightness(.45)}
.frame img,.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs button{padding:0;width:54px;height:54px;border-radius:8px;overflow:hidden;background:#000;border:2px solid transparent;position:relative}
.thumbs button.on{border-color:var(--brand)}
.thumbs img,.thumbs video{width:100%;height:100%;object-fit:contain;pointer-events:none}
.thumbs .st{position:absolute;right:2px;bottom:2px;font-size:10px;background:rgba(0,0,0,.7);border-radius:6px;padding:0 3px}
.meta{background:var(--card);border-radius:12px;padding:10px 12px}
.meta .cap{font-size:15px;margin-bottom:4px}
.meta .k{color:var(--muted);font-size:12px}
.right{display:flex;flex-direction:column;min-height:0;padding:12px 12px 12px 0;gap:10px}
#map{flex:1;min-height:260px;border-radius:14px;background:#d4dadc}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row input{flex:1;min-width:160px;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid #333847;background:#11141b;color:var(--ink)}
.coords{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.rule{font-size:12px;color:var(--warn)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:2000}
.overlay.show{display:grid}
.box{background:var(--card);border-radius:16px;padding:16px;width:min(720px,94vw);max-height:90svh;overflow:auto}
.box textarea{width:100%;height:260px;font:12px/1.4 ui-monospace,Menlo,monospace;background:#11141b;color:var(--ink);border-radius:10px;border:1px solid #333847;padding:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s;z-index:3000}
.toast.show{opacity:1}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}
  .left{overflow:visible}
  .frame{height:62svh;flex:none}
  .right{padding:0 12px 16px}
  #map{height:50svh;flex:none}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mark the unplaced shots</h1>
    <span class="prog" id="prog"></span><div class="bar"><i id="barFill"></i></div>
    <button id="exportBtn" class="primary">Export</button>
    <a class="btn" href="./">Back to game</a>
  </header>
  <section class="left">
    <div class="frame" id="frame"></div>
    <div class="thumbs" id="thumbs"></div>
    <div class="meta" id="meta"></div>
  </section>
  <section class="right">
    <div id="map" aria-label="Click the map to drop a pin for this shot"></div>
    <div class="row">
      <input id="place" placeholder="Place name (optional), e.g. 鳶嘴山 Yuanzui Mountain trailhead" autocomplete="off">
    </div>
    <div class="row">
      <span class="coords" id="coords">Click the map to drop a pin</span>
      <span style="flex:1"></span>
      <button id="sameBtn" title="Use the previous shot's pin">Same as previous</button>
      <button id="clearBtn">Clear pin</button>
      <button id="skipBtn">Skip</button>
      <button id="prevBtn">← Prev</button>
      <button id="nextBtn" class="primary">Save &amp; next →</button>
    </div>
    <div class="rule">Rule: never pin a home address or residence. Use the Skip button for anything that looks like someone's home.</div>
  </section>
</div>

<div class="overlay" id="exportBox"><div class="box">
  <div class="row" style="margin-bottom:10px"><b style="flex:1">Export</b>
    <button id="fmtJson" class="primary">JSON</button><button id="fmtCsv">CSV</button>
    <button id="copyBtn">Copy</button><button id="dlBtn">Download</button><button id="closeExport">Close</button></div>
  <textarea id="exportText" readonly></textarea>
  <p class="coords">Progress is saved in this browser (localStorage). Send the export back so the pins can be added to the game.</p>
</div></div>
<div class="toast" id="toast"></div>

<script src="vendor/leaflet/leaflet.js?v=fd29b2f433"></script>
<script src="vendor/maplibre/maplibre-gl.js?v=fd29b2f433"></script>
<script src="vendor/maplibre/leaflet-maplibre-gl.js?v=fd29b2f433"></script>
<script src="tiles.js?v=fd29b2f433"></script>
<script src="mark-data.js?v=fd29b2f433"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LS = "wis.mark.v1";
// One entry per media file (a post can show several different spots)
const ITEMS = (window.WIS_MARK_ITEMS || []).flatMap(p => p.files.map((f, j) => ({ ...f, post: p, idx: j })));
const st = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } })();
st.marks = st.marks || {}; st.cur = Math.min(st.cur || 0, Math.max(ITEMS.length - 1, 0));
const persist = () => { try { localStorage.setItem(LS, JSON.stringify(st)); } catch {} };
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1600); };

// map: OpenFreeMap via MapLibre (keyless), Esri fallback; see tiles.js
const map = L.map("map", { worldCopyJump: true }).setView([25, 60], 2);
window.WISTiles(map);
let marker = null, draft = null;
function setPin(lat, lng, pan) {
  draft = { lat: +lat.toFixed(6), lng: +lng.toFixed(6) };
  if (marker) marker.setLatLng([lat, lng]); else marker = L.marker([lat, lng], { draggable: true }).addTo(map).on("dragend", e => { const ll = e.target.getLatLng().wrap(); setPin(ll.lat, ll.lng); });
  if (pan) map.setView([lat, lng], Math.max(map.getZoom(), 12));
  $("#coords").textContent = `Pin: ${draft.lat.toFixed(5)}, ${draft.lng.toFixed(5)}`;
}
function clearPin() { draft = null; if (marker) { map.removeLayer(marker); marker = null; } $("#coords").textContent = "Click the map to drop a pin"; }
map.on("click", e => { const ll = e.latlng.wrap(); setPin(ll.lat, ll.lng); });

function status(it) { const m = st.marks[it.name]; return !m ? "" : m.skipped ? "skip" : "done"; }
function render() {
  if (!ITEMS.length) { $("#frame").textContent = "Nothing to mark."; return; }
  const it = ITEMS[st.cur], p = it.post, m = st.marks[it.name];
  const done = ITEMS.filter(x => status(x)).length;
  $("#prog").textContent = `Shot ${st.cur + 1} / ${ITEMS.length} · ${done} done`;
  $("#barFill").style.width = (100 * done / ITEMS.length) + "%";
  const fr = $("#frame");
  if (it.type === "video") {
    fr.style.setProperty("--bgimg", "none");
    fr.innerHTML = `<video src="${esc(it.src)}" controls autoplay muted loop playsinline preload="metadata"></video>`;
  } else {
    fr.style.setProperty("--bgimg", `url("${it.src}")`);
    fr.innerHTML = `<img src="${esc(it.src)}" alt="Shot to place">`;
  }
  $("#thumbs").innerHTML = ITEMS.map((x, i) => x.post !== p ? "" :
    `<button data-i="${i}" class="${i === st.cur ? "on" : ""}" title="${esc(x.name)}">${x.type === "video" ? `<video src="${esc(x.src)}#t=0.5" muted preload="metadata"></video>` : `<img src="${esc(x.src)}" loading="lazy" alt="">`}<span class="st">${status(x) === "done" ? "✓" : status(x) === "skip" ? "–" : ""}</span></button>`).join("");
  $("#meta").innerHTML = `<div class="cap">${esc(p.caption) || "<i>No caption</i>"}</div>
    <div class="k">File: ${esc(it.name)} (${it.idx + 1} of ${p.files.length} in this post) · <a href="${esc(p.post_url)}" target="_blank" rel="noopener">original post</a></div>
    <div class="k">Best guess (${esc(p.confidence)}): ${esc(p.best_guess)}</div>
    ${p.note ? `<div class="k">Note: ${esc(p.note)}</div>` : ""}
    ${m ? `<div class="k" style="color:${m.skipped ? "var(--warn)" : "var(--good)"}">${m.skipped ? "Skipped" : `Saved: ${m.lat}, ${m.lng}${m.place_name ? " · " + esc(m.place_name) : ""}`}</div>` : ""}`;
  $("#place").value = m && !m.skipped ? m.place_name || "" : "";
  if (m && !m.skipped && m.lat != null) setPin(m.lat, m.lng, true); else clearPin();
  $("#prevBtn").disabled = st.cur === 0;
  const prev = prevPin(); $("#sameBtn").disabled = !prev;
  setTimeout(() => map.invalidateSize(), 50);
}
function prevPin() { for (let i = st.cur - 1; i >= 0; i--) { const m = st.marks[ITEMS[i].name]; if (m && !m.skipped && m.lat != null) return m; } return null; }
function go(d) { st.cur = Math.max(0, Math.min(ITEMS.length - 1, st.cur + d)); persist(); render(); }
function saveCur(skipped) {
  const it = ITEMS[st.cur], place = $("#place").value.trim();
  if (skipped) st.marks[it.name] = { skipped: true, at: new Date().toISOString() };
  else if (draft) st.marks[it.name] = { lat: draft.lat, lng: draft.lng, place_name: place, at: new Date().toISOString() };
  else if (place) st.marks[it.name] = { lat: null, lng: null, place_name: place, at: new Date().toISOString() };
  else { toast("Drop a pin, type a place, or Skip"); return false; }
  persist(); return true;
}
$("#nextBtn").onclick = () => { if (!saveCur(false)) return; if (st.cur < ITEMS.length - 1) go(1); else { render(); openExport(); } };
$("#skipBtn").onclick = () => { saveCur(true); if (st.cur < ITEMS.length - 1) go(1); else render(); };
$("#prevBtn").onclick = () => go(-1);
$("#clearBtn").onclick = () => { clearPin(); delete st.marks[ITEMS[st.cur].name]; persist(); render(); };
$("#sameBtn").onclick = () => { const m = prevPin(); if (!m) return; setPin(m.lat, m.lng, true); if (!$("#place").value) $("#place").value = m.place_name || ""; };
$("#thumbs").onclick = e => { const b = e.target.closest("button[data-i]"); if (b) { st.cur = +b.dataset.i; persist(); render(); } };
$("#place").addEventListener("keydown", e => { if (e.key === "Enter") $("#nextBtn").click(); });

// export
let fmt = "json";
function rows() {
  return ITEMS.map(it => { const m = st.marks[it.name] || {};
    return { file: it.name, post_url: it.post.post_url, caption: it.post.caption, status: m.skipped ? "skipped" : m.lat != null ? "pinned" : m.place_name ? "name_only" : "todo",
             lat: m.lat ?? "", lng: m.lng ?? "", place_name: m.place_name || "" }; });
}
function exportText() {
  const r = rows();
  if (fmt === "json") return JSON.stringify(r, null, 2);
  const cols = Object.keys(r[0] || { file: 1 }), q = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v);
  return [cols.join(","), ...r.map(x => cols.map(c => q(x[c])).join(","))].join("\n");
}
function openExport() { $("#exportText").value = exportText(); $("#exportBox").classList.add("show"); }
$("#exportBtn").onclick = openExport;
$("#closeExport").onclick = () => $("#exportBox").classList.remove("show");
$("#fmtJson").onclick = () => { fmt = "json"; $("#fmtJson").className = "primary"; $("#fmtCsv").className = ""; openExport(); };
$("#fmtCsv").onclick = () => { fmt = "csv"; $("#fmtCsv").className = "primary"; $("#fmtJson").className = ""; openExport(); };
$("#copyBtn").onclick = async () => { try { await navigator.clipboard.writeText($("#exportText").value); toast("Copied"); } catch { $("#exportText").select(); document.execCommand("copy"); toast("Copied"); } };
$("#dlBtn").onclick = () => { const b = new Blob([(fmt === "csv" ? "\ufeff" : "") + $("#exportText").value], { type: fmt === "csv" ? "text/csv" : "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `whereisshe-marks.${fmt}`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#exportBox").classList.remove("show"); });
window.WISMARK = { map, ITEMS, st };
render();
})();
</script>
</body>
</html>
