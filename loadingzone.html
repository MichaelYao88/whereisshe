<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Loading Zone · whereisshe.gg</title>
<script>
  (function(){try{var t=JSON.parse(localStorage.getItem("wis.settings.v1")||"{}").theme||"dark";
  if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;}catch(e){document.documentElement.dataset.theme="dark";}})();
</script>
<style>
:root,[data-theme="dark"]{color-scheme:dark;--bg:#18181A;--card:#2B2B2E;--ink:#ECEAE4;--muted:#9C9A94;--line:rgba(236,234,228,.14);--brand:#3B5BFF;--today:#ffe58a;--ok:#8ddeaf;--warn:#f3b4b6;--thumb:#141416}
[data-theme="light"]{color-scheme:light;--bg:#f6f5f1;--card:#fff;--ink:#14161c;--muted:#6b7280;--line:#e5e7eb;--brand:#4f46e5;--today:#f5c542;--ok:#166534;--warn:#991b1b;--thumb:#e5e7eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Helvetica,"Helvetica Neue",Arial,sans-serif}
.lz-banner{margin:0;padding:10px 16px;background:rgba(59,91,255,.12);font:600 13px/1.4 Helvetica,Arial,sans-serif}
.lz-banner a{margin-left:.5rem;color:var(--ink)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:19px;margin:0;flex:1;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--brand);color:#fff}
main{max-width:920px;margin:0 auto;padding:10px 12px 40px}
.hidden{display:none!important}
.note{color:var(--muted);font-size:13px;margin:4px 2px 10px}
.days,.sets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.days{gap:12px}
.day{display:flex;flex-direction:column;align-items:stretch;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.day-top{display:flex;align-items:center;gap:10px}
.day.today{outline:2px solid var(--today)}
.day.past{opacity:.8}
.d-when{flex:none;width:92px;font-size:12px;color:var(--muted);line-height:1.25}
.d-when b{display:block;color:var(--ink);font-size:13px}
.d-main{flex:1;min-width:0}
.d-main h2{margin:0;font-size:15px;line-height:1.25}
.d-main p{margin:1px 0 0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.ok{color:var(--ok);border-color:currentColor}
.tag.warn{color:var(--warn);border-color:currentColor}
.play{flex:none;text-decoration:none;font-weight:800;font-size:13.5px;color:#fff;background:var(--brand);border-radius:999px;padding:7px 13px}
.play.disabled{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
.set{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.set>button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.set>button:focus-visible{outline:2px solid var(--brand)}
.s-main{flex:1;min-width:0}
.s-main b{display:block;font-size:14.5px}
.s-main small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-nums{flex:none;text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.s-nums b{color:var(--ink)}
.s-body{border-top:1px solid var(--line);padding:8px 12px 12px;font-size:13px}
.rounds{margin:8px 0 0;padding:0;list-style:none}
.rounds li{padding:3px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.rounds b{color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.th{position:relative;display:flex;flex-direction:column;border-radius:9px;overflow:hidden;background:var(--thumb)}
.th img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--thumb);flex:none}
.th .rn{position:absolute;left:5px;top:5px;background:rgba(0,0,0,.6);color:#fff;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px}
.th .vid{position:absolute;right:5px;top:5px;background:#fff;color:#111;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:999px}
.th .pl{padding:4px 6px 5px;font-size:10.5px;line-height:1.25;font-weight:700;color:#fff;background:#111;min-height:3.9em;flex:1 0 auto}
@media (max-width:560px){.d-when{width:72px}.play{padding:6px 10px}.thumbs{gap:4px}.th .pl{font-size:9.5px}}
</style>

<body>
<p class="lz-banner">Owner preview for whereisshe.gg. Play opens a sandboxed preview that <b>doesn’t count</b> toward stats or streaks. Not linked from the game.
  <a href="index.html">← Back to the game</a></p>
<header class="top">
  <h1>Loading Zone</h1>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabPreview" aria-selected="true">Preview</button>
    <button role="tab" id="tabData" aria-selected="false">Datasets</button>
  </nav>
</header>
<main>
  <section id="previewView">
    <p class="note" id="pvNote"></p>
    <ol class="days" id="days"></ol>
  </section>
  <section id="dataView" class="hidden">
    <p class="note" id="dsNote"></p>
    <ul class="sets" id="sets"></ul>
  </section>
</main>
<script src="puzzles-data.js?v=3148c28028"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad3 = n => String(n).padStart(3, "0");
const S = window.WIS_SCHEDULE || {}, ROWS = window.WIS_PUZZLE_ROWS || [];
const by = {}; ROWS.forEach(r => { if (!r.puzzle_id) return; (by[r.puzzle_id] = by[r.puzzle_id] || []).push(r); });
Object.values(by).forEach(rs => rs.sort((a, b) => a.round - b.round));
const utc = k => { const [y, m, d] = String(k).split("-").map(Number); return Date.UTC(y, m - 1, d); };
const keyOf = t => { const d = new Date(t); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`; };
const now = new Date(), today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
const fmtDate = k => new Date(utc(k)).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
const pinnedKeys = Object.keys(S.dates || {}).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
const lastPinned = pinnedKeys[pinnedKeys.length - 1];
const epoch = S.epoch && /^\d{4}-\d{2}-\d{2}$/.test(S.epoch) ? S.epoch : (pinnedKeys[0] || today);
function puzzleFor(key) {
  const pid = (S.dates || {})[key]; if (pid && by[pid]) return [pid, "pinned"];
  const rot = (S.rotation || []).filter(id => by[id]); if (!rot.length) return [null, "none"];
  const n = lastPinned && utc(key) > utc(lastPinned) ? Math.round((utc(key) - utc(lastPinned)) / 864e5) - 1 : Math.round((utc(key) - utc(epoch)) / 864e5);
  return [rot[((n % rot.length) + rot.length) % rot.length], "rotation"];
}
function warnings(pid, rs) {
  const w = [], vp = rs.map((r, i) => r.media_type === "video" ? i + 1 : 0).filter(Boolean), exc = (S.exceptions || {})[pid];
  if (rs.length !== 5) w.push(`${rs.length} rounds`);
  if (vp[0] !== 1) w.push("round 1 isn't a video");
  const pattern = vp.join();
  if (exc) { if (pattern !== "1") w.push(`videos in rounds ${pattern || "none"}`); }
  else if (pattern !== "1,2,3,4,5" && (vp.length >= 3 ? !(vp[0] === 1 && vp[1] === 2 && vp[vp.length - 1] === 5 && vp.length === 3) : pattern !== "1,5")) w.push(`videos in rounds ${pattern || "none"}`);
  rs.forEach((r, i) => { if (!(r.media_type === "video" ? r.poster_url : r.image_url)) w.push(`round ${i + 1} has no picture`); });
  return w;
}
const dayNo = key => Math.round((utc(key) - utc(epoch)) / 864e5) + 1;
const isPinned = pid => Object.values(S.dates || {}).includes(pid);
const inRotation = pid => (S.rotation || []).includes(pid);
function playOn(pid, start) {
  if (!pid) return null;
  for (let k = 0; k < 400; k++) {
    const key = keyOf(utc(start) + k * 864e5);
    if (dayNo(key) < 1) continue;
    if (puzzleFor(key)[0] === pid) return key;
  }
  return null;
}
function thumbs(rs) {
  return rs.map((r, i) => `<div class="th"><img loading="lazy" alt="" src="${esc(r.media_type === "video" ? r.poster_url : r.image_url)}"><span class="rn">${i + 1}</span>${r.media_type === "video" ? '<span class="vid">▶</span>' : ""}<span class="pl">${esc(r.place_name)}</span></div>`).join("");
}
const featured = rs => rs.find(r => r.featured_handle) || {};
const whoLine = f => f.featured_handle ? `@${esc(f.featured_handle)}${f.featured_name ? " · " + esc(f.featured_name) : ""}` : "no featured person";

const end = keyOf(Math.max(utc(today), utc(lastPinned || today)) + 60 * 864e5);
const days = [];
for (let t = utc(epoch); t <= utc(end); t += 864e5) {
  const key = keyOf(t), no = dayNo(key); if (no < 1) continue;
  const [pid, how] = puzzleFor(key); if (!pid) continue;
  days.push({ key, no, pid, how, rs: by[pid] || [] });
}
const rotOn = (S.rotation || []).some(id => by[id]);
const span = `${days.length} scheduled days, ${fmtDate(days[0] ? days[0].key : epoch)} to ${fmtDate(days.length ? days[days.length - 1].key : end)}`;
$("#pvNote").textContent = `${span}. ${rotOn ? "Unpinned days follow the rotation list." : "Nothing is scheduled after the last pinned day."} Play does not touch stats or streaks. Old schedule.html links land here.`;
$("#days").innerHTML = days.map(({ key, no, pid, how, rs }) => {
  const f = featured(rs), videos = rs.filter(r => r.media_type === "video");
  const w = warnings(pid, rs), exc = (S.exceptions || {})[pid];
  const when = key < today ? "past" : key === today ? "today" : "future";
  const tags = [`<span class="tag">${how}</span>`, `<span class="tag">${rs.length} rounds</span>`,
    `<span class="tag">${videos.length ? "video " + videos.map(r => r.round).join(" · ") : "no video"}</span>`,
    exc ? `<span class="tag" title="${esc(exc)}">1-video exception</span>` : "",
    w.map(x => `<span class="tag warn">${esc(x)}</span>`).join("")].join("");
  return `<li class="day ${when}" data-id="${esc(pid)}" data-key="${key}">
    <div class="day-top">
      <div class="d-when"><b>#${pad3(no)}</b>${esc(fmtDate(key))}${key === today ? "<br><b>Today</b>" : ""}</div>
      <div class="d-main"><h2>${esc(pid)}</h2><p>${whoLine(f)}</p>
        <div class="tags">${tags}</div></div>
      <a class="play" href="index.html?preview=${key}">Play</a>
    </div>
    <div class="thumbs">${thumbs(rs)}</div></li>`;
}).join("");

const ids = Object.keys(by).sort((a, b) => {
  const ord = id => { const ns = by[id].map(r => +r.daily_order).filter(n => n > 0); return ns.length ? Math.min(...ns) : 1e9; };
  return ord(a) - ord(b) || a.localeCompare(b);
});
const used = {}; days.forEach(d => { used[d.pid] = (used[d.pid] || 0) + 1; });
const vault = ids.map(pid => {
  const rs = by[pid];
  return { pid, rs, when: playOn(pid, today) || playOn(pid, epoch), used: used[pid] || 0 };
});
$("#dsNote").textContent = rotOn
  ? `${ids.length} puzzles in this build. Tap one for its rounds and places. “Used” counts this schedule window; a rotation puzzle keeps repeating after it. Nothing here is linked from the public game.`
  : `${ids.length} puzzles in this build. Tap one for its rounds and places. “Used” counts pinned days in this window. Rotation is empty, so unpinned puzzles stay off the calendar. Nothing here is linked from the public game.`;
$("#sets").innerHTML = vault.map((v, i) => {
  const f = featured(v.rs), videos = v.rs.filter(r => r.media_type === "video").length;
  const w = warnings(v.pid, v.rs), exc = (S.exceptions || {})[v.pid];
  const pinned = isPinned(v.pid), rot = inRotation(v.pid);
  const tags = [
    pinned ? `<span class="tag">pinned</span>` : "",
    rot ? `<span class="tag">in rotation</span>` : "",
    !pinned && !rot ? `<span class="tag warn">unused</span>` : "",
    w.length ? w.map(x => `<span class="tag warn">${esc(x)}</span>`).join("") : `<span class="tag ok">ok</span>`,
    exc ? `<span class="tag" title="${esc(exc)}">1-video exception</span>` : ""
  ].join("");
  return `<li class="set" data-id="${esc(v.pid)}"><button aria-expanded="false" data-i="${i}">
    <span class="s-main"><b>${esc(v.pid)}</b><small>${whoLine(f)}</small><span class="tags">${tags}</span></span>
    <span class="s-nums"><b>${v.rs.length}</b> rounds<br>${videos} video${videos === 1 ? "" : "s"} · used <b>${v.used}</b>×</span>
  </button></li>`;
}).join("");
const detail = v => {
  const play = v.when ? `<p><a class="play" href="index.html?preview=${v.when}">Play · ${esc(fmtDate(v.when))}</a></p>` : `<p class="play disabled">${rotOn ? "No scheduled date to preview. Pin it or add it to the rotation." : "No scheduled date to preview. Pin it to put it on a day."}</p>`;
  const lines = v.rs.map(r => `<li><b>Round ${esc(r.round)}</b> · ${r.media_type === "video" ? "video" : "photo"} · ${esc(r.place_name || "—")}${r.country ? ", " + esc(r.country) : ""}</li>`).join("");
  return `${play}<div class="thumbs">${thumbs(v.rs)}</div><ol class="rounds">${lines}</ol>`;
};
$("#sets").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]"); if (!b) return;
  const li = b.parentElement, open = b.getAttribute("aria-expanded") === "true";
  b.setAttribute("aria-expanded", String(!open));
  const body = li.querySelector(".s-body");
  if (open) { body && body.remove(); return; }
  li.insertAdjacentHTML("beforeend", `<div class="s-body">${detail(vault[+b.dataset.i])}</div>`);
});

const tab = v => {
  $("#tabPreview").setAttribute("aria-selected", String(v === "preview"));
  $("#tabData").setAttribute("aria-selected", String(v === "data"));
  $("#previewView").classList.toggle("hidden", v !== "preview");
  $("#dataView").classList.toggle("hidden", v !== "data");
  if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
};
$("#tabPreview").onclick = () => tab("preview");
$("#tabData").onclick = () => tab("data");
tab(location.hash === "#data" ? "data" : "preview");
const todayRow = document.querySelector(".day.today");
if (todayRow && location.hash !== "#data") todayRow.scrollIntoView({ block: "center" });
window.WISZONE = { puzzleFor, days: () => days.map(d => d.key + " " + d.pid), puzzles: () => ids };
})();
</script>
</body>
